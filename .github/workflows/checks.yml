name: Checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pinned package manager
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build
      - name: Install browser test tools
        run: |
          npm install --prefix .ci-tools --no-package-lock playwright@1.62.1
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser regression checks
        env:
          MARKNOTE_PLAYWRIGHT_PATH: ${{ github.workspace }}/.ci-tools/node_modules/playwright
        run: yarn test:browser
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: outputs/
          if-no-files-found: ignore
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Native regression checks
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
